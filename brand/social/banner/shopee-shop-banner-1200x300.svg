    <text id="banner-line" x="240" y="176" font-family="Noto Sans Thai, sans-serif" font-size="18" font-weight="400" fill="#B6B2AB" text-anchor="start">เริ่มวันนี้ วันละ 1 ชั่วโมง</text>
  </g>
  <rect id="offer-mark" x="560" y="143" width="7" height="7" rx="1" fill="#FFB020"/>
