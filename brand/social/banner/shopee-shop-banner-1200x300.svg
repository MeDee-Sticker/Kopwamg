  <style>
    @font-face {
      font-family: "Noto Sans Thai";
      font-style: normal;
      font-weight: 100 900;
      src: url("../../fonts/NotoSansThai.ttf") format("truetype");
    }
  </style>
  <rect id="background" width="1200" height="300" fill="#14161C"/>
  <g id="k-mark" transform="translate(15.174 25.174) scale(0.243802)" fill="none" stroke="#FFB020" stroke-width="116" stroke-linecap="round" stroke-linejoin="round"><path d="M328 270V754M328 512L696 270M328 512L696 754"/></g>
  <rect id="divider" x="208" y="72" width="2" height="156" rx="1" fill="#535353"/>
