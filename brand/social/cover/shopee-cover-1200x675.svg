    <text id="cover-line" x="96" y="398" font-family="Noto Sans Thai, sans-serif" font-size="21" font-weight="400" fill="#B2AEA7" text-anchor="start">ระบบวันละ 1 ชม. ให้ได้ผลลัพธ์จริง</text>
  </g>
  <g id="bullets">
