    <rect x="96" y="499" width="7" height="7" rx="1" fill="#FFB020"/><text id="bullet-2" x="118" y="506" font-family="Noto Sans Thai, sans-serif" font-size="20" font-weight="400" fill="#D1CCC2" text-anchor="start">สคริปต์ตอบแชท 12 สถานการณ์</text>
