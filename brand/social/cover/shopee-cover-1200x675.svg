  <title>Kopwang — Shopee Shop Cover 1200×675</title>
  <desc>หน้าปกร้าน Shopee 16:9 ใช้คำพูดและสัญลักษณ์ชุดเดียวกับ Facebook Page</desc>
  <style>
    @font-face {
      font-family: "Noto Sans Thai";
      font-style: normal;
      font-weight: 100 900;
      src: url("../../fonts/NotoSansThai.ttf") format("truetype");
    }
  </style>
  <rect id="background" width="1200" height="675" fill="#14161C"/>
  <g id="headline">
    <text id="eyebrow" x="96" y="132" font-family="Noto Sans Thai, sans-serif" font-size="13" font-weight="600" fill="#FFB020" text-anchor="start" letter-spacing="3">OFFICIAL SHOP</text>
    <text id="wordmark" x="96" y="268" font-family="Noto Sans Thai, sans-serif" font-size="92" font-weight="700" fill="#F5EFE2" text-anchor="start">Kopwang</text>
